name: CodeQL security analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - '*.sln'
      - 'Directory.Build.props'
  pull_request:
    paths:
      - '.github/workflows/codeql.yml'
      - 'src/**'
      - 'tests/**'
      - 'vendor/**'
      - '*.sln'
      - 'Directory.Build.props'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build
        run: dotnet build BatteryAlert.sln -c Release
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          category: '/language:csharp'

